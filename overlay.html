<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" /><title>markbox-overlay</title>
    <style>
      :root {
        --ink: #2a2350;
        --pink: #ff4fa3;
        --green: #2fce7c;
        --yellow: #ffd84d;
        --font: ui-rounded, -apple-system, "SF Pro Text", "PingFang SC",
          "Microsoft YaHei UI", system-ui, sans-serif;
      }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; cursor: crosshair; user-select: none; }
      #sel {
        position: fixed; left: 0; top: 0; width: 0; height: 0;
        border: 2px solid var(--pink); box-sizing: border-box;
        box-shadow: 0 0 0 200vmax rgba(31, 22, 58, 0.42); /* 巨型阴影=整屏压暗（微带紫的墨色），选区内透明 */
      }
      #sel .handle {
        position: absolute; width: 12px; height: 12px; background: #fff;
        border: 2px solid var(--pink); border-radius: 50%; display: none;
        box-shadow: 1.5px 1.5px 0 rgba(42, 35, 80, 0.45);
      }
      #sel.adjusting { cursor: move; }
      #sel.adjusting .handle { display: block; }
      .handle[data-h="nw"] { left: -7px; top: -7px; cursor: nwse-resize; }
      .handle[data-h="n"]  { left: calc(50% - 6px); top: -7px; cursor: ns-resize; }
      .handle[data-h="ne"] { right: -7px; top: -7px; cursor: nesw-resize; }
      .handle[data-h="e"]  { right: -7px; top: calc(50% - 6px); cursor: ew-resize; }
      .handle[data-h="se"] { right: -7px; bottom: -7px; cursor: nwse-resize; }
      .handle[data-h="s"]  { left: calc(50% - 6px); bottom: -7px; cursor: ns-resize; }
      .handle[data-h="sw"] { left: -7px; bottom: -7px; cursor: nesw-resize; }
      .handle[data-h="w"]  { left: -7px; top: calc(50% - 6px); cursor: ew-resize; }
      #size {
        position: absolute; left: 0; top: -26px; padding: 3px 10px; white-space: nowrap;
        background: var(--yellow); color: var(--ink); font: 600 12px/1.4 var(--font);
        border: 1.5px solid var(--ink); border-radius: 999px;
        box-shadow: 1.5px 1.5px 0 var(--ink); font-variant-numeric: tabular-nums;
        pointer-events: none; /* 纯信息展示：不拦截框顶缘/手柄的指针命中 */
      }
      #confirm {
        position: absolute; padding: 5px 14px; border: 1.5px solid var(--ink); border-radius: 999px; cursor: pointer;
        background: var(--green); color: var(--ink); font: 700 13px/1.4 var(--font);
        box-shadow: 2px 2px 0 var(--ink); display: none;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      #sel.adjusting #confirm { display: block; }
      #confirm:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
      #confirm:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
      #confirm:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) {
        #confirm { transition: none; }
        #confirm:hover { transform: none; box-shadow: 2px 2px 0 var(--ink); }
      }
    </style>
  </head>
  <body>
    <div id="sel">
      <div class="handle" data-h="nw"></div><div class="handle" data-h="n"></div>
      <div class="handle" data-h="ne"></div><div class="handle" data-h="e"></div>
      <div class="handle" data-h="se"></div><div class="handle" data-h="s"></div>
      <div class="handle" data-h="sw"></div><div class="handle" data-h="w"></div>
      <div id="size"></div>
      <button id="confirm">✓ 确认</button>
    </div>
    <script type="module" src="/src/overlay/overlay.ts"></script>
  </body>
</html>
