[package]
name = "markbox"
version = "0.1.0"
description = "MarkBox - screen region marker"
authors = ["Alex73NF"]
edition = "2021"

[lib]
# _lib 后缀使 lib 名与 bin 名不冲突（Windows 限制，rust-lang/cargo#8519，命名本身不改）
# 桌面端只需 rlib 供 main.rs 引用；staticlib/cdylib 是 Tauri 移动端目标才需要的
name = "markbox_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：macOS 下 tauri dev 的透明窗口必需（对应 tauri.conf.json 的 macOSPrivateApi），Windows 上无副作用，勿清理
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

