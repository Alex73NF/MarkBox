<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 小尺寸（ico 16/24/32 帧）专用简化变体：描边加粗、光晕收紧、手柄放大 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#271D4A"/>
      <stop offset="1" stop-color="#170F31"/>
    </linearGradient>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <rect x="152" y="280" width="720" height="432" rx="112" fill="none"
        stroke="#FF4FA3" stroke-width="130" filter="url(#halo)" opacity="0.5"/>

  <rect x="152" y="280" width="720" height="432" rx="112" fill="none"
        stroke="#FF4FA3" stroke-width="120"/>

  <circle cx="872" cy="712" r="58" fill="#FFFFFF" stroke="#FF4FA3" stroke-width="18"/>
  <circle cx="152" cy="280" r="58" fill="#FFFFFF" stroke="#FF4FA3" stroke-width="18"/>
</svg>
