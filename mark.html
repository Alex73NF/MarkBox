<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>markbox-mark</title>
    <style>
      /* inset 与 Rust 侧 MARK_GLOW_MARGIN_CSS 配套（跨文件契约）：窗口比标记矩形四周外扩 8px，
         #box 内缩同样的量把边框画回确认位置，外扩区域承载外侧发光（见 shared/glow.ts） */
      html,body{margin:0;width:100%;height:100%;background:transparent}
      #box{position:fixed;inset:8px;box-sizing:border-box;border-style:solid;visibility:hidden}
    </style>
  </head>
  <body><div id="box"></div><script type="module" src="/src/mark/mark.ts"></script></body>
</html>
